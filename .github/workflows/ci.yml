name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Redis for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          redis-server --version
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.18
          uv sync --locked --extra dev
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Test
        run: |
          mkdir -p .pytest_cache
          .venv/bin/pytest --basetemp=.pytest_cache/test-tmp

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    env:
      # Deliberately public test-only credentials, never used outside this isolated stack.
      LEADERBOARD_SUBMISSION_API_KEY: ci-only-submission-key-not-a-secret-0123456789
      LEADERBOARD_METRICS_API_KEY: ci-only-metrics-key-not-a-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - name: Build and wait for healthy containers
        run: docker compose -p leaderboard-ci -f compose.yaml -f compose.ci.yaml up --build --wait --wait-timeout 90
      - name: Exercise the packaged API against Redis
        run: docker compose -p leaderboard-ci -f compose.yaml -f compose.ci.yaml exec -T api python - < scripts/smoke.py
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose -p leaderboard-ci -f compose.yaml -f compose.ci.yaml logs --no-color --tail=100
      - name: Remove only the disposable CI stack
        if: always()
        run: docker compose -p leaderboard-ci -f compose.yaml -f compose.ci.yaml down
